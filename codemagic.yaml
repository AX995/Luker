
# Codemagic CI — builds the unsigned Luker iOS IPA without a Mac.
# Mirrors .github/workflows/ios-ipa.yml; the IPA is unsigned on purpose and is
# signed on-device with your own Apple ID (SideStore / AltStore).
workflows:
  ios-unsigned:
    name: Luker iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: latest
      xcode: latest
      vars:
        NODEJS_MOBILE_ASSET_URL: "https://github.com/funnycups/nodejs-mobile/releases/latest/download/nodejs-mobile-ios.zip"
        NODEJS_MOBILE_MIN_MAJOR: "24"
        NODEJS_MOBILE_ENFORCE_MIN_MAJOR: "1"
    cache:
      cache_paths:
        - ~/Library/Caches/Homebrew
        - $HOME/.npm
    scripts:
      - name: Toolchain versions
        script: |
          node -v
          npm -v
          xcodebuild -version
      - name: Install xcodegen
        script: |
          brew install xcodegen || brew upgrade xcodegen
      - name: Build unsigned IPA
        script: |
          bash ios-app/scripts/build-ios-ipa.sh debug
    artifacts:
      - ios-app/dist/*.ipa
