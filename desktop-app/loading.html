<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Luker</title>
<style>
    :root {
        color-scheme: light dark;
    }

    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: Canvas;
        color: CanvasText;
        -webkit-user-select: none;
        user-select: none;
    }

    main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
    }

    h1 {
        margin: 0 0 1.5rem;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
    }

    .status {
        font-size: 1rem;
        opacity: 0.8;
    }

    .status::after {
        content: '';
        display: inline-block;
        width: 0.5em;
        text-align: left;
        animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
    }

    .error {
        text-align: left;
        margin-top: 1.5rem;
    }

    .error .detail {
        margin: 0.75rem 0 0;
        padding: 0.75rem;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.12);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
    }

    .error .log-label {
        margin: 1rem 0 0;
        font-size: 0.9rem;
        opacity: 0.8;
    }
</style>
</head>
<body>
<main>
    <h1>Luker</h1>
    <div id="content"></div>
</main>
<script>
    const STRINGS = {
        'en': {
            starting: 'Starting Luker',
            failed: 'Luker failed to start.',
            logAt: 'Details were written to:',
        },
        'zh-CN': {
            starting: '正在启动 Luker',
            failed: 'Luker 启动失败。',
            logAt: '详细信息已写入:',
        },
        'zh-TW': {
            starting: '正在啟動 Luker',
            failed: 'Luker 啟動失敗。',
            logAt: '詳細資訊已寫入:',
        },
    };

    function pickStrings(locale) {
        if (Object.prototype.hasOwnProperty.call(STRINGS, locale)) {
            return STRINGS[locale];
        }
        const lower = String(locale || '').toLowerCase();
        if (lower.startsWith('zh')) {
            if (lower.includes('tw') || lower.includes('hk') || lower.includes('hant')) {
                return STRINGS['zh-TW'];
            }
            return STRINGS['zh-CN'];
        }
        return STRINGS['en'];
    }

    const params = new URLSearchParams(location.search);
    const strings = pickStrings(params.get('locale'));
    const error = params.get('error');
    const logPath = params.get('logPath');

    const content = document.getElementById('content');

    if (error) {
        const status = document.createElement('div');
        status.className = 'status';
        status.textContent = strings.failed;

        const block = document.createElement('div');
        block.className = 'error';

        const detail = document.createElement('pre');
        detail.className = 'detail';
        detail.textContent = error;
        block.appendChild(detail);

        if (logPath) {
            const label = document.createElement('p');
            label.className = 'log-label';
            label.textContent = strings.logAt;

            const path = document.createElement('pre');
            path.className = 'detail';
            path.textContent = logPath;

            block.appendChild(label);
            block.appendChild(path);
        }

        content.appendChild(status);
        content.appendChild(block);
    } else {
        const status = document.createElement('div');
        status.className = 'status';
        status.textContent = strings.starting;
        content.appendChild(status);
    }
</script>
</body>
</html>
